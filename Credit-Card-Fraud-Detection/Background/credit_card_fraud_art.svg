<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1a6e"/>
      <stop offset="50%" style="stop-color:#5c2d91"/>
      <stop offset="100%" style="stop-color:#1a0e3a"/>
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1050"/>
      <stop offset="60%" style="stop-color:#4a1e7a"/>
      <stop offset="100%" style="stop-color:#0f0820"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="50%" style="stop-color:#e8cc7a"/>
      <stop offset="100%" style="stop-color:#a07828"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b4dca"/>
      <stop offset="100%" style="stop-color:#5c2d91"/>
    </linearGradient>
    <radialGradient id="glowRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b06de8;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#b06de8;stop-opacity:0"/>
    </radialGradient>
    <filter id="cs">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#2d0a5a" flood-opacity="0.7"/>
    </filter>
    <filter id="cs2">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#1a0040" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background card (tilted behind) -->
  <g transform="rotate(-8, 210, 130)" filter="url(#cs2)">
    <rect x="18" y="28" width="370" height="224" rx="20" fill="url(#card2Grad)"/>
    <rect x="18" y="28" width="370" height="224" rx="20" fill="none" stroke="#7c3dbf" stroke-width="1" opacity="0.5"/>
    <rect x="18" y="115" width="370" height="34" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- Main card -->
  <g transform="rotate(4, 210, 130)" filter="url(#cs)">
    <rect x="22" y="18" width="370" height="224" rx="20" fill="url(#cardGrad)"/>
    <rect x="23" y="19" width="368" height="1.5" rx="1" fill="#c084f5" opacity="0.25"/>
    <rect x="22" y="18" width="370" height="224" rx="20" fill="none" stroke="#9b4dca" stroke-width="1.2" opacity="0.6"/>

    <!-- Brand rings top right -->
    <circle cx="356" cy="58" r="32" fill="#e040fb" opacity="0.18"/>
    <circle cx="336" cy="58" r="32" fill="#9b4dca" opacity="0.22"/>
    <circle cx="356" cy="58" r="32" fill="none" stroke="#c084f5" stroke-width="1" opacity="0.3"/>
    <circle cx="336" cy="58" r="32" fill="none" stroke="#9b4dca" stroke-width="1" opacity="0.3"/>

    <!-- EMV Chip -->
    <rect x="44" y="88" width="46" height="36" rx="5" fill="url(#chipGrad)"/>
    <line x1="44" y1="102" x2="90" y2="102" stroke="#a07828" stroke-width="0.8" opacity="0.7"/>
    <line x1="44" y1="113" x2="90" y2="113" stroke="#a07828" stroke-width="0.8" opacity="0.7"/>
    <line x1="59" y1="88" x2="59" y2="124" stroke="#a07828" stroke-width="0.8" opacity="0.7"/>
    <line x1="74" y1="88" x2="74" y2="124" stroke="#a07828" stroke-width="0.8" opacity="0.7"/>
    <rect x="60" y="95" width="12" height="12" rx="2" fill="#c9a84c" opacity="0.5"/>

    <!-- Contactless -->
    <path d="M102 104 Q109 97 109 107 Q109 117 102 110" fill="none" stroke="#c084f5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M107 100 Q118 91 118 107 Q118 123 107 114" fill="none" stroke="#c084f5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M112 96 Q127 85 127 107 Q127 129 112 118" fill="none" stroke="#c084f5" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Card number dots -->
    <circle cx="44" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="56" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="68" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="80" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>

    <circle cx="103" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="115" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="127" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="139" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>

    <circle cx="162" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="174" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="186" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>
    <circle cx="198" cy="168" r="3.5" fill="#e0c4f8" opacity="0.85"/>

    <!-- Last 4 visible -->
    <text x="218" y="174" font-family="monospace" font-size="15" fill="#e0c4f8" font-weight="600" opacity="0.95" letter-spacing="3">4829</text>

    <!-- Valid thru -->
    <text x="44" y="204" font-family="sans-serif" font-size="8" fill="#c084f5" opacity="0.6" letter-spacing="1">VALID THRU</text>
    <text x="44" y="216" font-family="monospace" font-size="12" fill="#e0c4f8" opacity="0.9" letter-spacing="1">••/••</text>

    <!-- Cardholder -->
    <text x="44" y="232" font-family="sans-serif" font-size="10" fill="#d0a8f0" opacity="0.7" letter-spacing="2">CARD HOLDER</text>

    <!-- Top label -->
    <text x="44" y="48" font-family="sans-serif" font-size="10" fill="#c084f5" opacity="0.6" letter-spacing="3">PREMIUM</text>
  </g>

  <!-- Shield (fraud/security icon) -->
  <g transform="translate(364, 198)">
    <path d="M0,-26 L18,-15 L18,5 Q18,21 0,29 Q-18,21 -18,5 L-18,-15 Z" fill="url(#shieldGrad)" opacity="0.92"/>
    <path d="M0,-26 L18,-15 L18,5 Q18,21 0,29 Q-18,21 -18,5 L-18,-15 Z" fill="none" stroke="#c084f5" stroke-width="1.2" opacity="0.5"/>
    <path d="M-7,3 L-2,9 L9,-4" fill="none" stroke="#e8d4ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="210" cy="130" rx="170" ry="110" fill="url(#glowRing)" opacity="0.5"/>

</svg>
